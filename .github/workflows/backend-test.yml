name: JobGuard 后端测试与种子数据灌�?

on:
  workflow_dispatch:  # 手动触发
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: jobguard
          MYSQL_USER: jobguard
          MYSQL_PASSWORD: jobguard123
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: jobguard
      MYSQL_PASSWORD: jobguard123
      MYSQL_DATABASE: jobguard
      CHROMA_PERSIST_DIR: ./data/chroma
      DEBUG: "true"
      SECRET_KEY: ci-test-secret-key
      CORS_ORIGINS: http://localhost:5173

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -u jobguard -pjobguard123 --silent; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done

      - name: Init database
        run: |
          mysql -h 127.0.0.1 -u jobguard -pjobguard123 jobguard < data/init.sql

      - name: Run unit tests
        run: |
          cd backend
          python -m pytest tests/ -v

      - name: Seed users
        run: |
          cd backend
          python scripts/seed_users.py

      - name: Seed jobs
        run: |
          cd backend
          python scripts/seed_jobs.py
          python scripts/seed_jobs_batch2.py
          python scripts/seed_jobs_batch3.py
          python scripts/seed_jobs_batch4.py

      - name: Test LLM Gateway connectivity
        run: |
          cd backend
          python -c "
          import os, sys, asyncio
          from dotenv import load_dotenv
          from app.llm.gateway import llm_gateway
          
          async def test_gateway():
              print('=== LLM Gateway 连通性测�? ===')
              
              # Test Zhipu
              print('\n[Zhipu] Testing primary chat...')
              try:
                  messages = [{'role': 'user', 'content': '请用一句话介绍你自�?'}]
                  resp = await llm_gateway.chat_primary(messages)
                  print(f'  OK: {resp[:80]}...')
              except Exception as e:
                  print(f'  FAIL: {e}')
              
              # Test DeepSeek
              print('\n[DeepSeek] Testing reasoning chat...')
              try:
                  messages = [{'role': 'user', 'content': '1+1等于几？请直接回�?'}]
                  resp = await llm_gateway.chat_reasoning(messages)
                  print(f'  OK: {resp[:80]}...')
              except Exception as e:
                  print(f'  FAIL: {e}')
              
              # Test SiliconFlow embedding
              print('\n[SiliconFlow] Testing embeddings...')
              try:
                  emb = await llm_gateway.embed(['测试文本'])
                  print(f'  OK: dim={len(emb[0]) if emb else 0}')
              except Exception as e:
                  print(f'  FAIL: {e}')
              
              print('\n=== 测试完成 ===')
          
          asyncio.run(test_gateway())
          "

      - name: Test Background Check Agent
        run: |
          cd backend
          python -c "
          import os, sys, json, asyncio
          from app.agents.background_check import background_check
          
          async def test_bg_check():
              # 选一个风险信号明显的岗位做背�?
              job_info = {
                  'company_name': '成都探真科技有限公司',
                  'job_title': 'Python AI工程师助�?',
                  'salary_min': 150, 'salary_max': 200,
                  'location': '成都·武侯�?',
                  'job_category': '工程',
                  'sub_category': 'AI Agent开�?',
                  'jd_raw_text': '7�?/周工作制，参与AI Agent开�?',
                  'requirements': ['Python', 'AI Agent'],
                  'company_size': '20-99�?',
                  'company_financing': '未融�?',
              }
              
              user_profile = {
                  'full_name': '测试用户',
                  'degree': '本科', 'major': '计算�?',
                  'skills': [{'skill_name': 'Python', 'proficiency': '熟练'}],
                  'years_of_experience': 0,
                  'expected_salary_min': 8000, 'expected_salary_max': 12000,
              }
              
              print('=== 背调分析测试 ===')
              report = await background_check.investigate(
                  job_info=job_info,
                  user_profile=user_profile,
              )
              print(json.dumps(report, ensure_ascii=False, indent=2))
          
          asyncio.run(test_bg_check())
          "

      - name: Batch Background Check (高风险岗�?)
        run: |
          cd backend
          python scripts/batch_background_check.py --risk-only --delay 2.0

      - name: Upload background check results
        uses: actions/upload-artifact@v4
        with:
          name: background-check-results
          path: |
            backend/data/batch_background_check_results.json
            backend/data/batch_background_check_summary.md

      - name: Summary
        run: |
          echo "�? 所有测试通过"
          echo "📊 LLM Gateway 三个服务均连通正�?"
          echo "🔍 背调分析功能可用"
          echo "📁 背调结果已上传为 Artifact"
